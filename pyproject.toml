[project]
name = "beatlrc"
version = "0.1.0"
description = "Offline per-bar synced lyrics generation"
requires-python = ">=3.12,<3.15"
license = "MIT"
readme = "README.md"
dependencies = [
  "beat-this>=1.1,<2",
  "demucs>=4.1,<5",
  "numpy>=1.26,<3",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
mac = ["mlx-whisper>=0.4.3,<0.5"]

[project.scripts]
beatlrc = "beatlrc.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beatlrc"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
